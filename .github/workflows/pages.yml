# Выкладывает прототип на GitHub Pages — бесплатный статический хостинг, который
# отдаёт файлы прямо из репозитория. Сайт получается по адресу
#   https://pashtetus1.github.io/Absentee/
#
# Pages держит ОДИН сайт на репозиторий, поэтому каждая ветка кладётся в свой
# подкаталог и адрес содержит её имя:
#   /                     — список всех веток
#   /prototypes/          — ветка prototypes
#   /main/                — ветка main
#   /что-угодно-ещё/      — любая ветка, которую запушили
# Ветки не перечислены заранее: сайт собирается из того, что реально есть в
# репозитории на момент запуска. Удалил ветку — она пропала и с сайта.
#
# Перед выкладкой прогоняются тесты ТОЙ ветки, в которую пушнули: остальные
# проверялись, когда пушили их. Если тесты падают, не публикуется ничего.

name: Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:        # кнопка "запустить вручную" во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Если пушнуть дважды подряд, старая выкладка отменяется и едет только свежая.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # нужны все ветки, а не только та, куда пушнули

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Прогнать тесты ветки ${{ github.ref_name }}
        run: |
          if [ -f test/run.js ]; then
            node test/run.js
          else
            echo "в этой ветке тестов нет — публикую как есть"
          fi

      - name: Собрать сайт из всех веток
        run: |
          mkdir -p site
          list=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin/HEAD$'); do
            br="${ref#origin/}"
            if ! git cat-file -e "$ref:index.html" 2>/dev/null; then
              echo "пропускаю $br: нет index.html"
              continue
            fi
            mkdir -p "site/$br"
            git show "$ref:index.html" > "site/$br/index.html"
            sha=$(git rev-parse --short "$ref")
            when=$(git log -1 --format=%cd --date=format:'%Y-%m-%d' "$ref")
            mark=""
            [ "$br" = "${{ github.ref_name }}" ] && mark=' · только что обновлена'
            list="$list<p style=\"margin:14px 0\"><a style=\"color:#f2b33d;font-size:17px\" href=\"$br/\">$br</a><br><span style=\"color:#5d6881;font-size:13px\">$sha · $when$mark</span></p>"
            echo "положил $br ($sha)"
          done
          # корневая страничка: вход должен объяснять, что где лежит
          {
            echo '<!doctype html><meta charset="utf-8"><title>Порог</title>'
            echo '<body style="background:#0f1526;color:#e4e9f4;font:15px/1.6 system-ui;padding:48px;max-width:60ch;margin:0 auto">'
            echo '<h1 style="font-size:22px;margin-bottom:6px">Порог</h1>'
            echo '<p style="color:#8894ae">Прототип игры про космическую империю, которой нельзя управлять напрямую. Каждая ветка репозитория выложена по своему адресу.</p>'
            echo "<div style=\"margin-top:26px\">$list</div>"
            echo "<p style=\"color:#5d6881;font-size:13px;margin-top:34px\">Собрано $(date -u '+%Y-%m-%d %H:%M UTC')</p>"
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

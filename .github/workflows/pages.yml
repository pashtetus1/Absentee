# Выкладывает прототип на GitHub Pages — бесплатный статический хостинг, который
# отдаёт файлы прямо из репозитория. Сайт получается по адресу
#   https://pashtetus1.github.io/Absentee/
#
# Публикуются ОБЕ ветки сразу, каждая в своём подкаталоге, потому что Pages
# держит один сайт на репозиторий:
#   /              — страничка со ссылками на обе версии
#   /prototypes/   — свежий прототип из ветки prototypes
#   /main/         — то, что лежит в main
#
# Перед выкладкой прогоняются тесты. Если они падают, не публикуется ничего:
# смысл пайплайна в том, чтобы наружу не уезжала сломанная версия.

name: Pages

on:
  push:
    branches: [main, prototypes]
  workflow_dispatch:        # кнопка "запустить вручную" во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Если пушнуть дважды подряд, старая выкладка отменяется и едет только свежая.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Забрать prototypes
        uses: actions/checkout@v4
        with:
          ref: prototypes
          path: src-prototypes

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Прогнать тесты
        run: |
          ran=0
          for dir in src-prototypes src-main; do
            if [ -f "$dir/test/run.js" ]; then
              echo "== тесты в $dir =="
              (cd "$dir" && node test/run.js)
              ran=1
            fi
          done
          [ "$ran" = 1 ] || echo "тестов нет ни в одной ветке — публикую как есть"

      - name: Собрать сайт
        run: |
          mkdir -p site/main site/prototypes
          for br in main prototypes; do
            if [ -f "src-$br/index.html" ]; then
              cp "src-$br/index.html" "site/$br/index.html"
            else
              printf '%s\n' \
                '<!doctype html><meta charset="utf-8"><title>Пусто</title>' \
                "<body style=\"background:#0f1526;color:#8894ae;font:15px system-ui;padding:40px\">" \
                "<p>В ветке <b>$br</b> нет index.html.</p>" \
                '<p><a style="color:#f2b33d" href="../">← назад</a></p>' > "site/$br/index.html"
            fi
          done
          # корневая страничка со ссылками: Pages отдаёт один сайт,
          # поэтому вход должен объяснять, что где лежит
          {
            echo '<!doctype html><meta charset="utf-8"><title>Порог</title>'
            echo '<body style="background:#0f1526;color:#e4e9f4;font:15px/1.6 system-ui;padding:48px;max-width:60ch;margin:0 auto">'
            echo '<h1 style="font-size:22px">Порог</h1>'
            echo '<p style="color:#8894ae">Прототип игры про космическую империю, которой нельзя управлять напрямую.</p>'
            echo '<p style="margin-top:24px"><a style="color:#f2b33d;font-size:18px" href="prototypes/">Свежая версия (ветка prototypes)</a><br>'
            echo "<span style=\"color:#5d6881;font-size:13px\">коммит $(cd src-prototypes && git rev-parse --short HEAD)</span></p>"
            echo '<p style="margin-top:16px"><a style="color:#f2b33d" href="main/">Версия из main</a><br>'
            echo "<span style=\"color:#5d6881;font-size:13px\">коммит $(cd src-main && git rev-parse --short HEAD)</span></p>"
            echo "<p style=\"color:#5d6881;font-size:13px;margin-top:32px\">Собрано $(date -u '+%Y-%m-%d %H:%M UTC')</p>"
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
